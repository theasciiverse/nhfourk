# Builds NetHack Fourk for the Asciiverse catalog: one archive per target,
# nhfourk-<target>.tar.gz (.zip for Windows), plus one SHA256SUMS file,
# attached to a GitHub release (hub/catalog/SCHEMA.md, release.source =
# "github"). Runs on a pushed tag, or by hand for an existing tag.
#
# Only the tty interface is built, through upstream's GNUmakefile
# (asciiverse/build.sh): no aimake, no SDL, no tiles. The executable needs
# no curses library; libuncursed draws with its own escape codes.
#
# Linux builds run in Alpine and link zlib and the C and C++ runtimes
# statically, so the binaries carry the -musl triple that av looks for
# first and need nothing on the player's machine. macOS links the system
# zlib, which every Mac has. Windows is cross-built on Ubuntu with MinGW
# and libuncursed's Windows console plugin; its data files are built on
# Linux, which is why quest.dat and the level files use int, not long.

name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base flex bison zlib-dev zlib-static perl &&
            LDFLAGS="-static -s" asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/nhfourk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          CC=cc CXX=c++ CFLAGS="-O2 -arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}" asciiverse/build.sh
          strip out/nhfourk
          file out/nhfourk
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
      CROSS: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flex bison zlib1g-dev libz-mingw-w64-dev g++-mingw-w64-x86-64 zip
          CROSS=$CROSS asciiverse/build.sh
          file out/nhfourk.exe
          asciiverse/package.sh $TARGET

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: release/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "NetHack Fourk $TAG" \
                 --notes "NetHack Fourk $TAG, Nathan Eady's variant of NetHack 4, tty interface only, built for the Asciiverse catalog."
          gh release upload "$TAG" release/* -R "$GITHUB_REPOSITORY" --clobber
